[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lejepa-from-scratch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["torch"]

[dependency-groups]
dev = [
    "albumentationsx[headless]>=2.4.11",
    "datasets>=5.0.1",
    "pillow>=12.3.0",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["lejepa"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D209"]
